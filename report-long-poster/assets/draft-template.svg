<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <rect width="1200" height="1800" fill="#FFFFFF"/>
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill:#18233A; }
    .center { text-anchor:middle; }
    .white { fill:#FFFFFF; }
    .light { fill:#DCE8FF; }
  </style>
  <rect x="60" y="60" width="1080" height="210" rx="24" fill="#2F6BFF"/>
  <text x="600" y="150" font-size="54" font-weight="700" class="center white">汇报长图标题</text>
  <text x="600" y="210" font-size="24" class="center light">副标题或核心结论</text>

  <rect x="60" y="330" width="1080" height="64" rx="14" fill="#2F6BFF"/>
  <text x="100" y="373" font-size="24" font-weight="700" class="white">01</text>
  <text x="600" y="374" font-size="32" font-weight="700" class="center white">第一部分</text>
  <text x="60" y="460" font-size="30" font-weight="700">模块主结论</text>
  <rect x="60" y="510" width="520" height="300" rx="18" fill="#F3F5F8" stroke="#DCE3ED" stroke-width="2"/>
  <text x="320" y="670" font-size="24" fill="#647087" class="center">图片占位 / 原始图片路径</text>
  <rect x="620" y="510" width="520" height="300" rx="18" fill="#F7F9FD" stroke="#2F6BFF" stroke-width="2"/>
  <text x="660" y="570" font-size="26" font-weight="700">要点标题</text>
  <text x="660" y="630" font-size="22">• 准确内容一</text>
  <text x="660" y="680" font-size="22">• 准确内容二</text>
  <text x="660" y="730" font-size="22">• 准确内容三</text>

  <rect x="60" y="900" width="1080" height="64" rx="14" fill="#14A078"/>
  <text x="100" y="943" font-size="24" font-weight="700" class="white">02</text>
  <text x="600" y="944" font-size="32" font-weight="700" class="center white">第二部分</text>
  <text x="60" y="1030" font-size="30" font-weight="700">模块主结论</text>
  <rect x="60" y="1080" width="1080" height="420" rx="18" fill="#F4FBF8" stroke="#BFE8DA" stroke-width="2"/>
  <text x="600" y="1290" font-size="24" fill="#647087" class="center">流程、对比或图片内容区域</text>
  <rect x="180" y="1550" width="840" height="72" rx="36" fill="#EAF8F3"/>
  <text x="600" y="1597" font-size="25" font-weight="700" fill="#14A078" class="center">底部核心结论</text>
</svg>
